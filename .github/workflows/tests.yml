name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 22 * * *"   # nightly run

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Smoke tests
        run: pytest -m smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: reports/

  full:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Full suite (UI + API)
        run: pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-report
          path: reports/
